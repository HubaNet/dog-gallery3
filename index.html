<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: black;
            overflow: hidden;
        }

        #main-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            width: 100%;
            max-height: 100vh;
            object-fit: contain; /* prevents distortion */
        }

        #navigation {
            position: absolute;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            font-size: clamp(20px, 5vw, 40px); /* scales with screen */
            cursor: pointer;
            transition: background-color 0.2s;
            min-width: 44px;
            min-height: 44px;
            padding: 10px;
        }

        button:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        button:active {
            transform: scale(0.95);
        }

        #backLayer {
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 10px;
        }

        #fwdLayer {
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 10px;
        }

        /* Mobile optimization */
        @media (max-width: 768px) {
            button {
                min-width: 50px;
                min-height: 50px;
            }
        }
    </style>
</head>
<body>
    <div id="main-container">
        <img id="pictureGallery" src="1.jpg" alt="Gallery image">
        <div id="navigation">
            <div id="backLayer" onclick="bck()">
                <button id="backButton" onclick="bck()">&lt;</button>
            </div>
            <div id="fwdLayer" onclick="fwd()">
                <button id="forwardButton" onclick="fwd()">&gt;</button>
            </div>
        </div>
    </div>

    <script>
        let picNum = 1;

        function fwd() {
            picNum++;
            if (picNum > 10) picNum = 1;
            document.getElementById("pictureGallery").src = `${picNum}.jpg`;
        }

        function bck() {
            picNum--;
            if (picNum < 1) picNum = 10;
            document.getElementById("pictureGallery").src = `${picNum}.jpg`;
        }
    </script>
</body>
</html>
