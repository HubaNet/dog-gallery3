<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
   <style>
    body {
        margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: black;
}

img {
    position: relative;
    width: 100%;
    /* height: 700px; */
    /* object-fit:cover; prevents distortion */
}

p {
    color: white;
    text-align: center;
}

#navigation {
    position: absolute;
    display: flex;
    flex-direction: row;
    justify-content: space-between; /* spreads buttons to edges */
    align-items: center;
    width: 100vw; /* match image width so buttons align with it */
    
}

button {
    background-color: rgb(0, 0, 0, 0.5);
    width: 50px;
    height: 100px;
    font-size: 30px;
    color: blue;
    cursor: pointer; /* improves UX */
}
#backLayer{
    width:50vw;
    height: 100vh;
    
    display: flex;
    justify-content: start;
    align-items: center;

}
#fwdLayer{
    width: 50vw;
    height: 100vh;
    
    display: flex;
    justify-content: end;
    align-items: center;
    
}
   </style>
</head>
<body>
    <img id="pictureGallery" src="1.jpg" alt="">
    <div id="navigation">
        <div id="backLayer"  onclick="bck()">
<button id="backButton" onclick="bck()"><</button>

        </div>

    <div id="fwdLayer" onclick="fwd()">
<button id="forwardButton" onclick="fwd()">></button>

    </div>
    

    
</div>
    <script>
   let picNum = 1;


function fwd() {
    picNum++;
   

    if (picNum > 10) picNum = 1;
   

    document.getElementById("pictureGallery").src = `${picNum}.jpg`;
}

function bck() {
    picNum--;
   

    if (picNum < 1) picNum = 10;
    

    
    document.getElementById("pictureGallery").src = `${picNum}.jpg`;
}
    </script>
</body>
</html>
